<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="headerBg" cx="30%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </radialGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="url(#headerBg)" />
  <rect width="1500" height="500" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="280" cy="250" r="240" fill="#6366f1" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="1250" cy="180" r="200" fill="#06b6d4" opacity="0.08" filter="url(#softGlow)" />
  <circle cx="850" cy="380" r="160" fill="#10b981" opacity="0.06" filter="url(#softGlow)" />

  <!-- Left: Stylized Floating Brand Emblem -->
  <g transform="translate(180, 250)">
    <!-- Outer Node Ring -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="6 12" opacity="0.5" />
    <circle cx="0" cy="-140" r="5" fill="#38bdf8" />
    <circle cx="140" cy="0" r="5" fill="#6366f1" />
    <circle cx="0" cy="140" r="5" fill="#10b981" />
    <circle cx="-140" cy="0" r="5" fill="#818cf8" />

    <!-- Shield Glow & Body -->
    <path d="M 0 -100 L 80 -65 C 80 25 0 95 0 95 C 0 95 -80 25 -80 -65 Z"
          fill="#0f172a" stroke="url(#primaryGrad)" stroke-width="6" stroke-linejoin="round" />

    <!-- Document Glyph -->
    <g transform="translate(-36, -55)">
      <path d="M 0 0 L 50 0 L 72 22 L 72 90 C 72 94 68 98 64 98 L 8 98 C 4 98 0 94 0 90 Z"
            fill="#1e1b4b" stroke="#6366f1" stroke-width="3" />
      <path d="M 50 0 L 50 22 L 72 22 Z" fill="#312e81" stroke="#6366f1" stroke-width="2.5" />
      <line x1="14" y1="30" x2="38" y2="30" stroke="#818cf8" stroke-width="3.5" stroke-linecap="round" />
      <line x1="14" y1="46" x2="58" y2="46" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
      <line x1="14" y1="60" x2="48" y2="60" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Verified Badge & Clock -->
    <g transform="translate(0, 42)" filter="url(#softGlow)">
      <circle cx="0" cy="0" r="32" fill="#090d16" stroke="url(#accentGrad)" stroke-width="4.5" />
      <path d="M -11 1 L -3 9 L 14 -8" fill="none" stroke="#10b981" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Center Typography & Brand Text -->
  <g transform="translate(420, 160)">
    
    <!-- Top Ecosystem Pill -->
    <rect x="0" y="0" width="310" height="32" rx="16" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1.5" opacity="0.9" />
    <circle cx="16" cy="16" r="4.5" fill="#38bdf8" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#c7d2fe" letter-spacing="0.5">
      BUILT ON BOHR TESTNET • CHAIN ID 968
    </text>

    <!-- Brand Name -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="900" fill="#ffffff" letter-spacing="-1">
      ExpiryChain
    </text>

    <!-- Tagline -->
    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" fill="#38bdf8" letter-spacing="-0.3">
      Register. Track. Verify. Never miss an expiry.
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      Decentralized document compliance registry. 100% confidential client-side SHA-256
    </text>
    <text x="0" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      fingerprinting with free, wallet-less public QR verification.
    </text>

    <!-- Feature Pills Row -->
    <g transform="translate(0, 226)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="165" height="30" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="19" font-family="monospace" font-size="11" font-weight="600" fill="#34d399">✓ Free Public Verify</text>

      <!-- Pill 2 -->
      <rect x="175" y="0" width="175" height="30" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="189" y="19" font-family="monospace" font-size="11" font-weight="600" fill="#818cf8">🔒 Zero File Upload</text>

      <!-- Pill 3 -->
      <rect x="360" y="0" width="165" height="30" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="374" y="19" font-family="monospace" font-size="11" font-weight="600" fill="#fbbf24">⏱️ Dynamic Expiry</text>
    </g>
  </g>

  <!-- Right: Perspective Compliance Block Cards -->
  <g transform="translate(1080, 130)">
    
    <!-- Card 1: Operating Certificate (Active) -->
    <g transform="translate(0, 0)">
      <rect width="320" height="74" rx="14" fill="#0f172a" stroke="#059669" stroke-width="1.5" opacity="0.95" />
      <circle cx="28" cy="28" r="6" fill="#10b981" />
      <text x="44" y="26" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Operating Certificate</text>
      <text x="44" y="42" font-family="monospace" font-size="10" fill="#94a3b8">EXP-000124 • 0x7f83b1...d9069</text>
      <rect x="235" y="18" width="65" height="22" rx="11" fill="#065f46" />
      <text x="249" y="33" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#34d399">VALID</text>
    </g>

    <!-- Card 2: Crane Safety Inspection (Warning <= 30d) -->
    <g transform="translate(20, 92)">
      <rect width="320" height="74" rx="14" fill="#0f172a" stroke="#d97706" stroke-width="1.5" opacity="0.95" />
      <circle cx="28" cy="28" r="6" fill="#f59e0b" />
      <text x="44" y="26" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Equipment Lifting Permit</text>
      <text x="44" y="42" font-family="monospace" font-size="10" fill="#94a3b8">EXP-000155 • 21 days left</text>
      <rect x="215" y="18" width="85" height="22" rx="11" fill="#78350f" />
      <text x="227" y="33" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#fbbf24">EXPIRING</text>
    </g>

    <!-- Card 3: Commercial Insurance (Critical <= 7d) -->
    <g transform="translate(40, 184)">
      <rect width="320" height="74" rx="14" fill="#0f172a" stroke="#e11d48" stroke-width="1.5" opacity="0.95" />
      <circle cx="28" cy="28" r="6" fill="#f43f5e" />
      <text x="44" y="26" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Commercial Liability Policy</text>
      <text x="44" y="42" font-family="monospace" font-size="10" fill="#94a3b8">EXP-000089 • 5 days left</text>
      <rect x="215" y="18" width="85" height="22" rx="11" fill="#881337" />
      <text x="227" y="33" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#fda4af">CRITICAL</text>
    </g>
  </g>

</svg>
