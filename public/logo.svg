<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>

    <!-- Shield Primary Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Clock / Check Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Background Base with subtle border -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="109" fill="none" stroke="#312e81" stroke-width="2" opacity="0.6" />

  <!-- Outer Cryptographic Blockchain Nodes Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="8 14" opacity="0.4" />
  <circle cx="256" cy="46" r="6" fill="#38bdf8" />
  <circle cx="466" cy="256" r="6" fill="#6366f1" />
  <circle cx="256" cy="466" r="6" fill="#10b981" />
  <circle cx="46" cy="256" r="6" fill="#818cf8" />

  <!-- Shield Body Outer Glow -->
  <path d="M 256 90 L 390 145 C 390 280 256 400 256 400 C 256 400 122 280 122 145 Z"
        fill="url(#shieldGrad)" opacity="0.15" filter="url(#glow)" />

  <!-- Shield Body Main -->
  <path d="M 256 100 L 380 150 C 380 270 256 385 256 385 C 256 385 132 270 132 150 Z"
        fill="#0f172a" stroke="url(#shieldGrad)" stroke-width="8" stroke-linejoin="round" />

  <!-- Inner Document Outline with Folded Corner -->
  <g transform="translate(196, 170)">
    <!-- Document Base -->
    <path d="M 0 0 L 80 0 L 120 40 L 120 160 C 120 168 114 174 106 174 L 14 174 C 6 174 0 168 0 160 Z"
          fill="#1e1b4b" stroke="#6366f1" stroke-width="5" stroke-linejoin="round" />
    
    <!-- Folded Corner -->
    <path d="M 80 0 L 80 40 L 120 40 Z" fill="#312e81" stroke="#6366f1" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Code Lines / Hash Representation -->
    <line x1="24" y1="48" x2="64" y2="48" stroke="#818cf8" stroke-width="5" stroke-linecap="round" />
    <line x1="24" y1="72" x2="96" y2="72" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <line x1="24" y1="94" x2="80" y2="94" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Glowing Expiry Ring / Clock + Verification Checkmark Overlay -->
  <g transform="translate(256, 305)" filter="url(#glow)">
    <!-- Dial Outer Ring -->
    <circle cx="0" cy="0" r="48" fill="#090d16" stroke="url(#accentGrad)" stroke-width="6" />
    
    <!-- Clock Ticks -->
    <line x1="0" y1="-42" x2="0" y2="-34" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="42" y1="0" x2="34" y2="0" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="42" x2="0" y2="34" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <line x1="-42" y1="0" x2="-34" y2="0" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    
    <!-- Bold Verified Checkmark inside Clock -->
    <path d="M -16 2 L -5 14 L 20 -12" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Small Glowing Constellation Dots -->
  <circle cx="160" cy="220" r="3.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="350" cy="210" r="3" fill="#a855f7" opacity="0.8" />
  <circle cx="330" cy="360" r="3" fill="#10b981" opacity="0.7" />
  <circle cx="180" cy="350" r="3.5" fill="#6366f1" opacity="0.7" />
</svg>

